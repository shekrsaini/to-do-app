<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #1b2233;
  --muted: #6b7489;
  --line: #e2e6ee;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --done: #9aa3b5;
  --high: #e03131;
  --med: #f08c00;
  --low: #2f9e6b;
  --shadow: 0 1px 2px rgba(27,34,51,.04), 0 12px 32px -12px rgba(27,34,51,.14);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f131c;
  --surface: #171c28;
  --ink: #eaeef7;
  --muted: #8a93a8;
  --line: #262d3d;
  --accent: #7c93ff;
  --accent-soft: #232b4a;
  --done: #5b6479;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-padding-top: 1rem; }
body {
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: clamp(1rem, 6vw, 4.5rem) 1rem;
  transition: background .25s, color .25s;
}
.app { width: 100%; max-width: 620px; }

header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
h1 { font-size: clamp(2rem, 6vw, 2.75rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
.date { color: var(--muted); margin-top: .4rem; font-size: .95rem; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer;
  display: grid; place-items: center; flex: none; transition: border-color .15s, transform .15s;
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }
:root[data-theme="dark"] .sun { display: block; }
:root[data-theme="dark"] .moon { display: none; }
.sun { display: none; }

.progress { display: flex; align-items: center; gap: .9rem; margin-bottom: 1.25rem; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .45s cubic-bezier(.2,.8,.2,1); }
.progress small { color: var(--muted); font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }

.add { display: flex; gap: .5rem; padding: .75rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.add input[type="text"] {
  flex: 1 1 200px; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 1.05rem; padding: .65rem .75rem; outline: none;
}
.add input::placeholder { color: var(--muted); }
select {
  font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 0 .6rem; height: 42px; cursor: pointer;
}
.btn {
  font: inherit; font-weight: 500; border: 0; border-radius: 10px; height: 42px; padding: 0 1.1rem;
  background: var(--accent); color: #fff; cursor: pointer; transition: filter .15s, transform .15s;
}
:root[data-theme="dark"] .btn { color: #0f131c; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }

.filters { display: flex; gap: .25rem; padding: .6rem .75rem; border-bottom: 1px solid var(--line); }
.filters button {
  font: inherit; font-size: .9rem; border: 0; background: transparent; color: var(--muted);
  padding: .4rem .8rem; border-radius: 8px; cursor: pointer; transition: background .15s, color .15s;
}
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

ul { list-style: none; padding: 0; margin: 0; }
li {
  display: flex; align-items: center; gap: .85rem; padding: .9rem 1rem;
  border-bottom: 1px solid var(--line); animation: in .25s ease;
}
li:last-child { border-bottom: 0; }
li.leaving { opacity: 0; transform: translateX(16px); transition: opacity .2s, transform .2s; }
@keyframes in { from { opacity: 0; transform: translateY(-6px); } }

.check {
  appearance: none; -webkit-appearance: none; width: 22px; height: 22px; flex: none; cursor: pointer;
  border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center;
  transition: background .15s, border-color .15s;
}
.check:hover { border-color: var(--accent); }
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after {
  content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
:root[data-theme="dark"] .check:checked::after { border-color: #0f131c; }

.text { flex: 1; min-width: 0; font-size: 1.02rem; line-height: 1.4; overflow-wrap: anywhere; cursor: text; }
li.done .text { color: var(--done); text-decoration: line-through; text-decoration-color: var(--done); }
.edit {
  flex: 1; min-width: 0; font: inherit; font-size: 1.02rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--accent); border-radius: 8px; padding: .3rem .5rem; outline: none;
}

.prio { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 0; padding: 0; cursor: pointer; background: var(--low); }
.prio[data-p="med"] { background: var(--med); }
.prio[data-p="high"] { background: var(--high); }
li.done .prio { opacity: .35; }

.del {
  border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 32px; height: 32px;
  border-radius: 8px; display: grid; place-items: center; opacity: 0; transition: opacity .15s, background .15s, color .15s;
}
li:hover .del, .del:focus-visible { opacity: 1; }
.del:hover { background: var(--accent-soft); color: var(--high); }
.del svg { width: 16px; height: 16px; }
@media (hover: none) { .del { opacity: 1; } }

.empty { text-align: center; padding: 3rem 1.5rem; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: .3rem; font-weight: 500; }

footer { display: flex; justify-content: space-between; align-items: center; padding: .7rem 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
footer button { font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: .3rem .5rem; border-radius: 6px; }
footer button:hover { color: var(--high); }
footer button:disabled { opacity: .4; pointer-events: none; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1 id="greeting">Today</h1>
      <p class="date" id="date"></p>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="progress" aria-live="polite">
    <div class="bar"><span id="fill"></span></div>
    <small id="progressText"></small>
  </div>

  <section class="card">
    <div class="add">
      <input type="text" id="input" placeholder="Add a task" maxlength="200" autocomplete="off" aria-label="New task">
      <select id="priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="med">Medium</option>
        <option value="high">High</option>
      </select>
      <button class="btn" id="addBtn">Add task</button>
    </div>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Completed</button>
    </div>
    <ul id="list"></ul>
    <footer>
      <span id="count"></span>
      <button id="clear">Clear completed</button>
    </footer>
  </section>
</main>

<script>
(function () {
  const KEY = "tasks.v1", THEME = "tasks.theme";
  const $ = (id) => document.getElementById(id);
  const list = $("list"), input = $("input");
  let tasks = [], filter = "all";

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  try { tasks = JSON.parse(store.get(KEY)) || []; } catch (e) { tasks = []; }
  if (!Array.isArray(tasks)) tasks = [];
  const save = () => store.set(KEY, JSON.stringify(tasks));

  /* Theme */
  const savedTheme = store.get(THEME);
  const dark = savedTheme ? savedTheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("theme").onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set(THEME, next);
  };

  /* Header */
  const now = new Date(), h = now.getHours();
  $("greeting").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  $("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  const NEXT = { low: "med", med: "high", high: "low" };
  const LABEL = { low: "Low", med: "Medium", high: "High" };
  const trashIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>';

  function add() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    tasks.unshift({ id: Date.now() + Math.random(), text, done: false, p: $("priority").value });
    input.value = "";
    save(); render(); input.focus();
  }

  function remove(id, el) {
    el.classList.add("leaving");
    setTimeout(() => { tasks = tasks.filter(t => t.id !== id); save(); render(); }, 180);
  }

  function startEdit(t, textEl) {
    const field = document.createElement("input");
    field.className = "edit"; field.value = t.text; field.maxLength = 200;
    field.setAttribute("aria-label", "Edit task");
    textEl.replaceWith(field); field.focus(); field.select();
    let finished = false;
    const finish = (commit) => {
      if (finished) return; finished = true;
      const v = field.value.trim();
      if (commit && v) { t.text = v; save(); }
      render();
    };
    field.onblur = () => finish(true);
    field.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  }

  function row(t) {
    const li = document.createElement("li");
    if (t.done) li.className = "done";

    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.className = "check"; cb.checked = t.done;
    cb.setAttribute("aria-label", "Mark complete");
    cb.onchange = () => { t.done = cb.checked; save(); render(); };

    const text = document.createElement("span");
    text.className = "text"; text.textContent = t.text; text.title = "Double-click to edit";
    text.ondblclick = () => startEdit(t, text);

    const pr = document.createElement("button");
    pr.className = "prio"; pr.dataset.p = t.p;
    pr.title = LABEL[t.p] + " priority (click to change)";
    pr.setAttribute("aria-label", pr.title);
    pr.onclick = () => { t.p = NEXT[t.p]; save(); render(); };

    const del = document.createElement("button");
    del.className = "del"; del.innerHTML = trashIcon; del.setAttribute("aria-label", "Delete task");
    del.onclick = () => remove(t.id, li);

    li.append(cb, text, pr, del);
    return li;
  }

  function render() {
    const shown = tasks.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    list.replaceChildren(...shown.map(row));

    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty"; li.style.display = "block";
      const msgs = {
        all: ["No tasks yet", "Type a task above and press Enter."],
        active: ["Nothing left to do", "All your tasks are complete."],
        done: ["No completed tasks", "Finished tasks will show up here."]
      }[filter];
      li.innerHTML = "<strong></strong><span></span>";
      li.firstChild.textContent = msgs[0]; li.lastChild.textContent = msgs[1];
      list.append(li);
    }

    const total = tasks.length, done = tasks.filter(t => t.done).length, left = total - done;
    $("fill").style.width = (total ? (done / total) * 100 : 0) + "%";
    $("progressText").textContent = total ? done + " of " + total + " done" : "No tasks";
    $("count").textContent = left + (left === 1 ? " task left" : " tasks left");
    $("clear").disabled = !done;
  }

  $("addBtn").onclick = add;
  input.onkeydown = (e) => { if (e.key === "Enter") add(); };
  $("clear").onclick = () => { tasks = tasks.filter(t => !t.done); save(); render(); };
  document.querySelectorAll(".filters button").forEach(b => {
    b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
      render();
    };
  });

  render();
})();
</script>
</body>
</html>
